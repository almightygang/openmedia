name: Build/release Tauri app

on:
  push:
    tags:
      - v*.*.*

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (amd64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openmedia/desktop-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: openmedia/desktop-tauri

      - name: Download ffmpeg sidecars
        run: npm run download-ffmpeg
        working-directory: openmedia/desktop-tauri

      - name: Build app
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: openmedia/desktop-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmedia-${{ runner.os }}
          path: |
            openmedia/desktop-tauri/src-tauri/target/release/bundle/
